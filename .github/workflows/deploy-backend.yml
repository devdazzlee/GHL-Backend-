name: Deploy Backend to VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /var/www/GHL-Backend-
            git fetch origin main
            git reset --hard origin/main
            cd backend
            # .env is kept on the server and never overwritten by git
            test -f .env
            npm install --omit=dev
            npx prisma generate
            npx prisma db push
            pm2 restart gbp-backend --update-env
            # Boot takes a few seconds (googleapis + prisma imports on 1 vCPU),
            # so poll instead of sleeping a fixed amount.
            for i in $(seq 1 30); do
              if curl -fs http://127.0.0.1:4000/health; then
                echo
                echo "Health OK after ${i}s"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Health check failed after 30s; recent logs:"
                pm2 logs gbp-backend --lines 40 --nostream
                exit 1
              fi
              sleep 1
            done
            echo "Deploy OK: $(git -C /var/www/GHL-Backend- rev-parse --short HEAD)"
