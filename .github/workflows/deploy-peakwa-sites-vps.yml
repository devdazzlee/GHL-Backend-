name: Deploy peakwa-sites to frontend VPS

# Builds the site renderer here (never on the server) and runs it on the
# frontend VPS as the peakwa-sites systemd service (127.0.0.1:3100, behind
# nginx for site.peakwa.com). Each deploy is its own release folder; if the
# new release doesn't answer, the previous one is switched back automatically.

on:
  push:
    branches: [main, feature/vps-frontends]
    paths:
      - 'peakwa-sites/**'
      - '.github/workflows/deploy-peakwa-sites-vps.yml'
  workflow_dispatch:

concurrency:
  group: deploy-peakwa-sites-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peakwa-sites
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: peakwa-sites/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (self-contained server)
        run: npm run build
        env:
          NEXT_OUTPUT_STANDALONE: '1'
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Package release
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf "$RUNNER_TEMP/peakwa-sites.tgz" -C .next/standalone .
          du -h "$RUNNER_TEMP/peakwa-sites.tgz"

      - name: SSH key
        working-directory: .
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.FRONTEND_VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.FRONTEND_VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload, switch and health-check
        working-directory: .
        env:
          VPS: ${{ secrets.FRONTEND_VPS_USER }}@${{ secrets.FRONTEND_VPS_HOST }}
          RELEASE: ${{ github.sha }}
        run: |
          scp -i ~/.ssh/deploy_key "$RUNNER_TEMP/peakwa-sites.tgz" "$VPS:/tmp/peakwa-sites-$RELEASE.tgz"
          ssh -i ~/.ssh/deploy_key "$VPS" "RELEASE=$RELEASE bash -s" <<'REMOTE'
          set -euo pipefail
          BASE=/var/www/peakwa-sites
          DIR="$BASE/releases/$RELEASE"
          rm -rf "$DIR" && mkdir -p "$DIR"
          tar -xzf "/tmp/peakwa-sites-$RELEASE.tgz" -C "$DIR"
          rm -f "/tmp/peakwa-sites-$RELEASE.tgz"
          PREV="$(readlink -f "$BASE/current" 2>/dev/null || true)"
          ln -sfn "$DIR" "$BASE/current"
          systemctl restart peakwa-sites
          for i in $(seq 1 40); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: site.peakwa.com' http://127.0.0.1:3100/ || true)"
            if [ "$code" = 200 ]; then echo "peakwa-sites healthy after ${i}s ($RELEASE)"; break; fi
            if [ "$i" = 40 ]; then
              echo "health check failed (HTTP $code)"
              journalctl -u peakwa-sites -n 40 --no-pager || true
              if [ -n "$PREV" ] && [ -d "$PREV" ] && [ "$PREV" != "$DIR" ]; then
                ln -sfn "$PREV" "$BASE/current"
                systemctl restart peakwa-sites
                echo "rolled back to $PREV"
              fi
              exit 1
            fi
            sleep 1
          done
          # Keep the 5 newest releases.
          ls -1dt "$BASE"/releases/* | tail -n +6 | xargs -r rm -rf
          REMOTE
